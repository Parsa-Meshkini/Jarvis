services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB:       jarvis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 5s
      timeout:  5s
      retries:  5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout:  5s
      retries:  5

  api:
    build:
      context:    .
      dockerfile: Dockerfile
    command: python run.py
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jarvis:jarvis@postgres:5432/jarvis
      REDIS_URL:    redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  worker:
    build:
      context:    .
      dockerfile: Dockerfile
    command: sh -c "PYTHONPATH=/app arq app.workers.agent_worker.WorkerSettings"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jarvis:jarvis@postgres:5432/jarvis
      REDIS_URL:    redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - api
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http api:8000 --log=stdout
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: